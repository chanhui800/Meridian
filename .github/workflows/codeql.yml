name: CodeQL

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: go

      - name: Build
        run: go build -trimpath -buildvcs=false ./...

      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          category: .github/workflows/codeql.yml:analyze
          output: ${{ runner.temp }}/codeql-results
          post-processed-sarif-path: ${{ runner.temp }}/codeql-policy-sarif

      - name: Enforce reviewed high-risk CodeQL findings
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGER_ACTOR: ${{ github.triggering_actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          trusted_dir="$RUNNER_TEMP/meridian-codeql-policy"
          mkdir -p "$trusted_dir"
          if [ "$EVENT_NAME" = pull_request ]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "$BASE_SHA^{commit}"
          fi
          if [ "$EVENT_NAME" = pull_request ] && git cat-file -e "$BASE_SHA:.github/codeql-reviewed-alerts.json"; then
            # Always execute the base verifier. It uses base records by default;
            # only an API-confirmed admin/maintain actor may refresh candidate
            # records for the exact current PR head.
            git show "$BASE_SHA:.github/codeql-reviewed-alerts.json" > "$trusted_dir/reviews.json"
            git show "$BASE_SHA:scripts/codeql-policy.mjs" > "$trusted_dir/codeql-policy.mjs"
            echo 'Using the base branch CodeQL policy and verifier.'
            node "$trusted_dir/codeql-policy.mjs" pr \
              --sarif "$RUNNER_TEMP/codeql-policy-sarif" \
              --base-policy "$trusted_dir/reviews.json" \
              --policy .github/codeql-reviewed-alerts.json \
              --base-sha "$BASE_SHA" --head-sha "$PR_HEAD_SHA" \
              --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" \
              --actor "$TRIGGER_ACTOR" --root "$GITHUB_WORKSPACE"
          else
            # The first introduction has no prior policy. Its baseline is an
            # explicit maintainer-reviewed bootstrap; subsequent PRs use base.
            if [ "$EVENT_NAME" = pull_request ]; then
              echo '::notice::First CodeQL policy bootstrap: maintainers must review the initial verifier and exact review records.'
            fi
            cp .github/codeql-reviewed-alerts.json "$trusted_dir/reviews.json"
            cp scripts/codeql-policy.mjs "$trusted_dir/codeql-policy.mjs"
            node "$trusted_dir/codeql-policy.mjs" sarif \
              --sarif "$RUNNER_TEMP/codeql-policy-sarif" \
              --policy "$trusted_dir/reviews.json" --root "$GITHUB_WORKSPACE"
          fi
