name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      # Controller binaries are cross-compiled for Windows and macOS. Agents
      # remain Linux-only because traffic counters use Linux sysfs.
      - name: Vet non-unix build targets
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Security lint
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          gosec -quiet -severity medium -confidence medium ./...

      - name: Validate frontend and installer syntax
        run: |
          find web/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test tests/*.test.js
          bash -n install.sh
          bash -n scripts/agent-install.sh
          bash -n docker-entrypoint.sh
          bash -n tests/install_test.sh
          bash -n tests/docker_entrypoint_test.sh
          bash -n tests/upstream_header_key_test.sh
          bash -n tests/dynamic_route_key_test.sh
          bash -n scripts/release-policy.sh
          bash -n tests/release_policy_test.sh
          shellcheck install.sh scripts/agent-install.sh docker-entrypoint.sh scripts/release-policy.sh tests/install_test.sh tests/docker_entrypoint_test.sh tests/upstream_header_key_test.sh tests/dynamic_route_key_test.sh tests/release_policy_test.sh
          bash tests/dynamic_route_key_test.sh
          bash tests/upstream_header_key_test.sh
          bash tests/install_test.sh
          bash tests/release_policy_test.sh

      - name: Test Docker entrypoint
        run: bash tests/docker_entrypoint_test.sh

      - name: Build
        run: go build -trimpath -buildvcs=false -o meridian .

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: meridian:ci
          build-args: VERSION=ci
