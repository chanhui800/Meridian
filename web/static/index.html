<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — Emby 反代管理面板</title>
<meta name="description" content="Meridian 轻量级 Emby 反向代理管理面板">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1.8.36">
<script src="/js/theme.js?v=1.8.36"></script>
<link rel="stylesheet" href="/css/style.css?v=1.8.36">
</head>
<body class="auth-checking">

<!-- Login Page -->
<div id="page-login">
  <div class="login-card">
    <div class="login-brand">
      <img src="/favicon.svg" alt="" class="login-logo">
      <h1>Meridian</h1>
      <p>Emby 反代管理面板</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>用户名</label>
        <input type="text" class="form-input" id="inp-username" placeholder="admin" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" class="form-input" id="inp-password" placeholder="••••••••" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="form-group" id="setup-token-group" hidden>
        <label for="inp-setup-token">初始化令牌</label>
        <input type="password" class="form-input" id="inp-setup-token" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="请从安装输出或部署配置中复制">
        <div class="form-help">首次创建管理员时需要。Docker 用户可通过 <code>docker compose logs meridian</code> 查看自动生成的初始化令牌。</div>
      </div>
      <button type="submit" class="btn-login" id="btn-login">登录</button>
    </form>
    <div class="login-footer" id="login-footer">正在检查初始化状态...</div>
  </div>
</div>

<!-- App Shell -->
<div id="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="/favicon.svg" alt="" class="sidebar-logo">
      <span class="sidebar-brand-name">Meridian</span>
      <span class="sidebar-version" id="sidebar-version">v1.8.36</span>
    </div>
    <nav class="sidebar-nav" aria-label="功能菜单">
      <a href="#dashboard" class="topnav-link active" data-page="dashboard" title="仪表盘">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>仪表盘</span>
      </a>
      <a href="#sites" class="topnav-link" data-page="sites" title="站点管理">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><circle cx="7" cy="7" r="1"/><circle cx="7" cy="17" r="1"/></svg>
        <span>站点管理</span>
      </a>
      <a href="#request-logs" class="topnav-link" data-page="request-logs" title="日志记录">
        <svg viewBox="0 0 24 24"><polyline points="3 12 6.5 12 9 5 13 19 16 12 21 12"/></svg>
        <span>日志记录</span>
      </a>
      <a href="#traffic" class="topnav-link" data-page="traffic" title="流量统计">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="5" y2="10"/><line x1="12" y1="19" x2="12" y2="5"/><line x1="19" y1="19" x2="19" y2="13"/></svg>
        <span>流量统计</span>
      </a>
      <a href="#global-settings" class="topnav-link global-settings-link" data-page="global-settings" title="全局设置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.09a2 2 0 0 1 1 1.74v.5a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/><circle cx="12" cy="12" r="3"/></svg>
        <span>全局设置</span>
      </a>
    </nav>
    <a class="sidebar-account" id="avatar-btn" href="#account" aria-label="打开账户页面" title="账户">
      <span class="avatar-btn" id="avatar-initial">A</span>
      <span class="sidebar-account-copy"><strong id="sidebar-username">管理员</strong><small>账户</small></span>
      <svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5"/></svg>
    </a>
  </aside>

  <header class="app-header">
    <div class="app-header-leading">
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="展开导航栏" aria-expanded="false" title="展开导航栏">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <polyline class="sidebar-toggle-chevron" points="12 8 16 12 12 16"/>
        </svg>
      </button>
      <span class="app-header-icon" id="app-page-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
      </span>
      <div class="app-header-copy">
        <h1 id="app-page-title">仪表盘</h1>
        <p id="app-page-subtitle">反代服务运行概览</p>
      </div>
    </div>
    <div class="app-header-actions">
      <a class="github-project-link" href="https://github.com/chanhui800/Meridian" target="_blank" rel="noopener noreferrer" aria-label="打开 Meridian GitHub 项目" title="GitHub 项目">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.86c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.64-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02A9.58 9.58 0 0 1 12 6.84a9.6 9.6 0 0 1 2.5.34c1.9-1.29 2.74-1.02 2.74-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.68-4.57 4.93.36.31.68.92.68 1.86v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg>
      </a>
      <button class="theme-toggle theme-toggle-header" id="theme-toggle" type="button" aria-label="切换到白色背景" aria-pressed="false" title="切换到白色背景">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8a8.5 8.5 0 1 0 11.4 11.4z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Area -->
  <div class="main">
    <div id="page-dashboard" class="page active"></div>
    <div id="page-sites" class="page"></div>
    <div id="page-traffic" class="page"></div>
    <div id="page-diagnostics" class="page"></div>
    <div id="page-request-logs" class="page"></div>
    <div id="page-telegram-report" class="page"></div>
    <div id="page-settings-tls" class="page"></div>
    <div id="page-global-settings" class="page"></div>
    <div id="page-backup-restore" class="page"></div>
    <div id="page-account" class="page"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay" aria-hidden="true">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h3 id="modal-title"></h3>
        <button type="button" class="modal-close" id="modal-close" aria-label="关闭弹窗">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

</div>

<!-- Login errors must remain visible while the application shell is hidden. -->
<div id="toast-container" aria-live="polite"></div>

<script src="/js/api.js?v=1.8.36"></script>
<script src="/js/toast.js?v=1.8.36"></script>
<script src="/js/router.js?v=1.8.36"></script>
<script src="/js/pages/dashboard.js?v=1.8.36"></script>
<script src="/js/pages/sites.js?v=1.8.36"></script>
<script src="/js/pages/traffic.js?v=1.8.36"></script>
<script src="/js/pages/diag.js?v=1.8.36"></script>
<script src="/js/pages/request-logs.js?v=1.8.36"></script>
<script src="/js/pages/telegram-report.js?v=1.8.36"></script>
<script src="/js/pages/global-settings.js?v=1.8.36"></script>
<script src="/js/pages/account.js?v=1.8.36"></script>
<script src="/js/app.js?v=1.8.36"></script>
</body>
</html>
